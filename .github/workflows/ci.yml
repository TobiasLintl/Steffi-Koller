name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://seelenzeit:seelenzeit@localhost:5432/seelenzeit
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret

jobs:
  checks:
    name: Lint, typecheck, tests, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seelenzeit
          POSTGRES_PASSWORD: seelenzeit
          POSTGRES_DB: seelenzeit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seelenzeit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain -- src/server/db/migrations)"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seelenzeit
          POSTGRES_PASSWORD: seelenzeit
          POSTGRES_DB: seelenzeit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seelenzeit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
